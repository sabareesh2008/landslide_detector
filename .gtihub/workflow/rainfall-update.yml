name: Hourly NASA Rainfall Update

on:
  schedule:
    - cron: "15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rainfall:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy rasterio

      - name: Update NASA rainfall
        env:
          NASA_PPS_EMAIL: ${{ secrets.NASA_PPS_EMAIL }}
        run: |
          python scripts/rainfall_incremental_updater.py

      - name: Save updated rainfall data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/rainfall/processed/

          if git diff --cached --quiet; then
            echo "No new rainfall data."
          else
            git commit -m "Hourly NASA rainfall update"
            git push
          fi