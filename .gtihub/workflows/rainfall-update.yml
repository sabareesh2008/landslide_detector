name: Deploy Landslide Sentinel AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # IMPORTANT:
      # Build ONLY the Vite React frontend.
      - name: Build React frontend
        run: npx vite build --base=/landslide_detector/

      # Verify that Vite actually created the production bundle
      - name: Verify Vite build
        run: |
          echo "===== DIST CONTENT ====="
          find dist -maxdepth 2 -type f | sort

          echo "===== DIST INDEX ====="
          cat dist/index.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dist folder
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4