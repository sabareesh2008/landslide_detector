name: NASA IMERG Rainfall & Landslide Risk Update

on:
  schedule:
    # Run every 30 minutes to match NASA IMERG 30-min Early Run publication cadence
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rainfall-and-risk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install rasterio numpy pandas scikit-learn xgboost lightgbm

      - name: Fetch Incremental NASA IMERG Rainfall
        env:
          NASA_PPS_EMAIL: ${{ secrets.NASA_PPS_EMAIL }}
          NASA_PPS_PASSWORD: ${{ secrets.NASA_PPS_PASSWORD }}
        run: |
          python scripts/rainfall_incremental_updater.py --non-interactive || echo "Proceeding with risk prediction engine"

      - name: Execute Risk Prediction Engine
        run: |
          python scripts/risk_engine.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Auto-update: 30-min NASA IMERG rainfall & calibrated risk [skip ci]"
            git push
          fi
