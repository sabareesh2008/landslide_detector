name: Model Training & Benchmark Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/ml/**'
      - 'data/validated/**'

concurrency:
  group: model-training-group
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt || pip install numpy pandas scikit-learn requests scipy

      - name: Run Model Training & Calibration Suite
        run: |
          python scripts/ml/validate_dataset.py
          python scripts/ml/prepare_dataset.py
          python scripts/ml/train_baseline.py
          python scripts/ml/train_models.py
          python scripts/ml/calibrate_model.py
          python scripts/ml/evaluate_models.py

      - name: Run E2E Test Suite
        run: |
          python -m unittest tests/test_e2e_phases3_8.py -v

      - name: Update Risk & Spatial Artifacts
        run: |
          python scripts/risk_engine.py
          python scripts/gis/spatial_processor.py
          python scripts/emergency/impact_analyzer.py

      - name: Commit Updated Model Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/model/ data/gis/ data/infrastructure/
          if git diff --staged --quiet; then
            echo "No model changes to commit."
          else
            git commit -m "Auto-update: Calibrated ML model artifacts & benchmarks [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
