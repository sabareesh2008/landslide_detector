name: Landslide Sentinel AI Model Training

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ml_pipeline.py'
      - 'data/landslides/**'
      - 'data/dem/**'

permissions:
  contents: write

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install rasterio numpy pandas scikit-learn xgboost lightgbm

      - name: Run Machine Learning Pipeline
        run: |
          python scripts/ml_pipeline.py

      - name: Update Risk Artifacts
        run: |
          python scripts/risk_engine.py

      - name: Commit Model Metrics & Evaluation Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/model_metrics.json data/historical_replay.json data/current_risk.json data/risk_grid.geojson
          if git diff --staged --quiet; then
            echo "No model changes to commit."
          else
            git commit -m "Auto-update: Trained ML model evaluation metrics & calibration [skip ci]"
            git push
          fi
