version: '3.8'

services:
  landslide-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: landslide_sentinel_web
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
